<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Arif Gadgets mark">
  <defs>
    <linearGradient id="agChip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16233C"/>
      <stop offset="1" stop-color="#0A101E"/>
    </linearGradient>
    <linearGradient id="agGold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A18"/>
      <stop offset="0.55" stop-color="#F5B301"/>
      <stop offset="1" stop-color="#FFD75E"/>
    </linearGradient>
    <linearGradient id="agRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD75E" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#FF7A18" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- chip pins -->
  <g fill="url(#agGold)" opacity="0.9">
    <rect x="0" y="18" width="5" height="5" rx="1.6"/>
    <rect x="0" y="29.5" width="5" height="5" rx="1.6"/>
    <rect x="0" y="41" width="5" height="5" rx="1.6"/>
    <rect x="59" y="18" width="5" height="5" rx="1.6"/>
    <rect x="59" y="29.5" width="5" height="5" rx="1.6"/>
    <rect x="59" y="41" width="5" height="5" rx="1.6"/>
  </g>

  <!-- chip body -->
  <rect x="4" y="4" width="56" height="56" rx="17" fill="url(#agChip)"/>
  <rect x="5" y="5" width="54" height="54" rx="16" fill="none" stroke="url(#agRim)" stroke-width="1.5"/>

  <!-- corner circuit traces -->
  <g stroke="#22D3EE" stroke-width="1.1" stroke-linecap="round" opacity="0.45" fill="none">
    <path d="M12 20v-4a4 4 0 0 1 4-4h4"/>
    <path d="M52 44v4a4 4 0 0 1-4 4h-4"/>
  </g>

  <!-- monogram A -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 47 31.2 18" stroke="url(#agGold)" stroke-width="5.4"/>
    <path d="M45 47 32.8 18" stroke="#FFD75E" stroke-width="5.4" opacity="0.62"/>
    <path d="M24.6 36.4h14.8" stroke="#22D3EE" stroke-width="3.4"/>
  </g>
  <circle cx="32" cy="16.4" r="3.2" fill="#FFD75E"/>
  <circle cx="32" cy="16.4" r="6.2" fill="#FFD75E" opacity="0.16"/>
</svg>
