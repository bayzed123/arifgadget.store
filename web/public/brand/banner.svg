<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560" role="img" aria-label="Welcome to Arif Gadget Store — genuine gadgets delivered across Bangladesh">
  <defs>
    <linearGradient id="bnBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A101E"/>
      <stop offset="0.45" stop-color="#101B31"/>
      <stop offset="1" stop-color="#070C16"/>
    </linearGradient>
    <linearGradient id="bnGold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A18"/>
      <stop offset="0.55" stop-color="#F5B301"/>
      <stop offset="1" stop-color="#FFD75E"/>
    </linearGradient>
    <linearGradient id="bnGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="bnScreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF7A18" stop-opacity="0.30"/>
    </linearGradient>
    <radialGradient id="bnGlowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF7A18" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF7A18" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bnGlowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="bnGrid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0v44" fill="none" stroke="#7DD3FC" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="bnClip"><rect width="1600" height="560" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#bnClip)">
    <rect width="1600" height="560" fill="url(#bnBg)"/>
    <rect width="1600" height="560" fill="url(#bnGrid)"/>
    <ellipse cx="1230" cy="200" rx="440" ry="360" fill="url(#bnGlowA)"/>
    <ellipse cx="330" cy="520" rx="420" ry="300" fill="url(#bnGlowB)"/>

    <!-- circuit filigree -->
    <g fill="none" stroke="#22D3EE" stroke-opacity="0.22" stroke-width="1.4" stroke-linecap="round">
      <path d="M0 128h180l36-36h150"/>
      <path d="M0 452h240l40 40h180"/>
      <path d="M1600 96h-200l-44 44h-120"/>
    </g>
    <g fill="#FFD75E" fill-opacity="0.5">
      <circle cx="366" cy="92" r="4"/><circle cx="420" cy="492" r="4"/><circle cx="1236" cy="140" r="4"/>
    </g>

    <!-- ===== device cluster ===== -->
    <g transform="translate(1010 78)">
      <!-- tablet (back) -->
      <g transform="translate(232 44) rotate(9)">
        <rect x="0" y="0" width="250" height="330" rx="24" fill="#0E1729" stroke="url(#bnGlass)" stroke-width="2"/>
        <rect x="12" y="12" width="226" height="306" rx="16" fill="url(#bnScreen)" opacity="0.55"/>
        <g fill="#E2E8F0" fill-opacity="0.22">
          <rect x="32" y="40" width="120" height="12" rx="6"/>
          <rect x="32" y="66" width="80" height="10" rx="5"/>
          <rect x="32" y="112" width="86" height="86" rx="12"/>
          <rect x="132" y="112" width="86" height="86" rx="12"/>
          <rect x="32" y="214" width="186" height="10" rx="5"/>
          <rect x="32" y="236" width="140" height="10" rx="5"/>
        </g>
      </g>

      <!-- phone (front) -->
      <g transform="translate(74 0) rotate(-6)">
        <rect x="-6" y="-6" width="228" height="416" rx="42" fill="url(#bnGold)" opacity="0.30"/>
        <rect x="0" y="0" width="216" height="404" rx="38" fill="#0B1322" stroke="url(#bnGlass)" stroke-width="2"/>
        <rect x="10" y="10" width="196" height="384" rx="30" fill="url(#bnScreen)"/>
        <rect x="78" y="18" width="60" height="12" rx="6" fill="#060B14" opacity="0.85"/>
        <g fill="#F8FAFC" fill-opacity="0.28">
          <rect x="30" y="56" width="156" height="70" rx="12"/>
          <rect x="30" y="140" width="72" height="72" rx="12"/>
          <rect x="114" y="140" width="72" height="72" rx="12"/>
          <rect x="30" y="226" width="156" height="12" rx="6"/>
          <rect x="30" y="250" width="110" height="12" rx="6"/>
        </g>
        <rect x="30" y="300" width="156" height="40" rx="20" fill="url(#bnGold)" opacity="0.92"/>
      </g>

      <!-- smartwatch -->
      <g transform="translate(6 300) rotate(-10)">
        <rect x="26" y="-30" width="52" height="40" rx="14" fill="#1E293B"/>
        <rect x="26" y="94" width="52" height="40" rx="14" fill="#1E293B"/>
        <rect x="0" y="0" width="104" height="104" rx="30" fill="#0B1322" stroke="url(#bnGlass)" stroke-width="2"/>
        <rect x="8" y="8" width="88" height="88" rx="24" fill="url(#bnScreen)"/>
        <circle cx="52" cy="52" r="26" fill="none" stroke="#FFD75E" stroke-width="5" stroke-linecap="round" stroke-dasharray="122 41" transform="rotate(-90 52 52)"/>
      </g>

      <!-- earbuds case -->
      <g transform="translate(392 316) rotate(6)">
        <rect x="0" y="0" width="132" height="96" rx="26" fill="#0E1729" stroke="url(#bnGlass)" stroke-width="2"/>
        <path d="M0 42h132" stroke="#22D3EE" stroke-opacity="0.35" stroke-width="2"/>
        <circle cx="40" cy="68" r="15" fill="#111C2F" stroke="#FFD75E" stroke-opacity="0.55" stroke-width="2"/>
        <circle cx="92" cy="68" r="15" fill="#111C2F" stroke="#FFD75E" stroke-opacity="0.55" stroke-width="2"/>
        <rect x="52" y="14" width="28" height="6" rx="3" fill="#22D3EE" fill-opacity="0.5"/>
      </g>
    </g>

    <!-- ===== copy ===== -->
    <g font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
      <g transform="translate(96 134)">
        <rect x="0" y="0" width="330" height="38" rx="19" fill="#FF7A18" fill-opacity="0.14" stroke="#FF7A18" stroke-opacity="0.45"/>
        <circle cx="24" cy="19" r="5" fill="#22D3EE"/>
        <text x="42" y="24.5" font-size="13.5" font-weight="700" letter-spacing="2.4" fill="#FFD75E">GADGET STORE • BANGLADESH</text>
      </g>

      <text x="96" y="252" font-size="60" font-weight="800" letter-spacing="-1" fill="#F8FAFC">Welcome to</text>
      <text x="96" y="334" font-size="72" font-weight="800" letter-spacing="-1.5" fill="url(#bnGold)">Arif Gadget Store</text>

      <text x="96" y="392" font-size="21" font-weight="500" fill="#94A3B8">Phones, audio, wearables, chargers and accessories — genuine products,</text>
      <text x="96" y="422" font-size="21" font-weight="500" fill="#94A3B8">honest prices, and fast delivery anywhere in Bangladesh.</text>

      <g transform="translate(96 462)">
        <rect x="0" y="0" width="8" height="26" rx="4" fill="url(#bnGold)"/>
        <text x="24" y="19" fill="#64748B" font-size="14" font-weight="600" letter-spacing="1.4">GENUINE PRODUCTS · CASH ON DELIVERY · 7-DAY RETURNS</text>
      </g>
    </g>

    <rect x="1" y="1" width="1598" height="558" rx="27" fill="none" stroke="#FFD75E" stroke-opacity="0.16" stroke-width="2"/>
  </g>
</svg>
