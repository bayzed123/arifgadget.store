name: Deploy

# Production only. The github-pages environment refuses deployments from any
# branch but the default one, so running this on a feature branch produced a
# guaranteed red X before a single step executed. Feature branches get CI.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Pages deployment needs these; everything else is read-only.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race on the same D1 database.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api:
    name: Worker API
    runs-on: ubuntu-latest
    outputs:
      api_url: ${{ steps.bootstrap.outputs.api_url }}
    env:
      # Repository secrets are named CLOUD_FLARE_*; wrangler reads the
      # CLOUDFLARE_* spellings, so both are exported from the same source and
      # neither value is ever echoed.
      CLOUD_FLARE_API: ${{ secrets.CLOUD_FLARE_API }}
      CLOUD_FLARE_ACCOUNT_ID: ${{ secrets.CLOUD_FLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUD_FLARE_API }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUD_FLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Creates D1 / R2 / KV on the first run, reuses them afterwards, and
      # writes the resolved IDs into worker/wrangler.toml.
      - name: Provision Cloudflare resources
        id: bootstrap
        env:
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          WORKERS_SUBDOMAIN: ${{ vars.WORKERS_SUBDOMAIN }}
        run: node scripts/bootstrap-cf.mjs

      - name: Apply D1 migrations
        working-directory: worker
        run: npx wrangler d1 migrations apply arif-gadgets --remote

      - name: Deploy Worker
        working-directory: worker
        run: npx wrangler deploy

      - name: Ensure Worker secrets
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          # Steadfast courier. Optional: unset simply leaves the courier panel
          # reporting itself as not connected.
          STEADFAST_API_KEY: ${{ secrets.STEADFAST_API_KEY }}
          STEADFAST_SECRET_KEY: ${{ secrets.STEADFAST_SECRET_KEY }}
        run: node scripts/provision-secrets.mjs

      - name: Provision the dashboard owner
        env:
          D1_DATABASE_ID: ${{ steps.bootstrap.outputs.database_id }}
          # Prefer the variable: a username is not sensitive, and storing one
          # as a secret makes Actions redact that word everywhere it appears —
          # including inside the API URL, which then cannot cross job boundaries.
          ADMIN_USERNAME: ${{ vars.ADMIN_USERNAME || secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_NAME: ${{ vars.ADMIN_NAME }}
        run: node scripts/create-admin.mjs

      # Never fails the job. The Worker is already deployed by this point; a
      # freshly registered workers.dev subdomain can take several minutes to
      # get its TLS certificate (curl reports a handshake failure until then),
      # and blocking the storefront on that would be wrong.
      - name: Smoke test the deployment
        run: |
          URL="${{ steps.bootstrap.outputs.api_url }}"
          if [ -z "$URL" ]; then echo "No API URL resolved — skipping"; exit 0; fi

          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 "$URL/health" > /tmp/health.json 2>/dev/null; then
              echo "API is live:"; cat /tmp/health.json; echo; exit 0
            fi
            echo "waiting for the Worker and its certificate ($i/12)…"
            sleep 15
          done

          echo "::warning::$URL has not answered /health yet. On a newly registered workers.dev subdomain this is normal — the TLS certificate can take several minutes to issue, and curl reports an SSL handshake failure until it does. The Worker itself deployed successfully. Check $URL/health in a few minutes; if it is still failing, re-run this workflow."
          exit 0

  web:
    name: Storefront
    needs: api
    runs-on: ubuntu-latest
    # Belt and braces: Pages only accepts the default branch anyway.
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # A custom domain serves from the root, a project Pages site from
      # /<repo>/, and the router's basename follows Vite's base — get this
      # wrong and every asset 404s. Read the domain GitHub already has
      # configured rather than relying on a variable being kept in sync.
      - name: Resolve the Pages domain
        id: site
        env:
          GH_TOKEN: ${{ github.token }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: |
          # In order: the explicit variable, the CNAME file GitHub writes when
          # you set a custom domain in the UI, then the Pages API.
          DOMAIN="$CUSTOM_DOMAIN"
          if [ -z "$DOMAIN" ] && [ -f CNAME ]; then
            DOMAIN=$(tr -d '[:space:]' < CNAME)
          fi
          if [ -z "$DOMAIN" ]; then
            DOMAIN=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                          -H "Accept: application/vnd.github+json" \
                          "https://api.github.com/repos/${{ github.repository }}/pages" 2>/dev/null \
                     | python3 -c "import sys,json;print(json.load(sys.stdin).get('cname') or '')" 2>/dev/null || true)
          fi
          if [ -n "$DOMAIN" ]; then
            echo "Publishing to https://$DOMAIN (base /)"
            echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "No custom domain — publishing to the project Pages path"
            echo "domain=" >> "$GITHUB_OUTPUT"
            echo "base=/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          VITE_BASE: ${{ steps.site.outputs.base }}
          VITE_API_BASE: ${{ needs.api.outputs.api_url }}
        run: |
          if [ -z "$VITE_API_BASE" ]; then
            echo "::error::The API has no public address yet, so the storefront would have nothing to talk to. Set ONE of these repository variables and re-run: API_DOMAIN (e.g. api.arifgadget.store — recommended, wrangler creates the Cloudflare custom domain), WORKERS_SUBDOMAIN (registers your one-time *.workers.dev name), or API_BASE_URL (an address you route yourself). The Worker itself is already deployed and the database is migrated."
            exit 1
          fi
          npm run build --workspace web

      - name: Prepare Pages artifact
        env:
          CUSTOM_DOMAIN: ${{ steps.site.outputs.domain }}
        run: |
          # Pages serves 404.html for unknown paths; handing it the SPA shell
          # makes client-side routes survive a hard refresh.
          cp web/dist/index.html web/dist/404.html
          touch web/dist/.nojekyll
          if [ -n "$CUSTOM_DOMAIN" ]; then echo "$CUSTOM_DOMAIN" > web/dist/CNAME; fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - id: pages
        uses: actions/deploy-pages@v4
