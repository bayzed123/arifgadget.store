#:schema node_modules/wrangler/config-schema.json
name = "arif-gadgets-api"
main = "src/index.ts"
compatibility_date = "2024-12-05"
compatibility_flags = ["nodejs_compat"]

# Filled in at deploy time from the CLOUD_FLARE_ACCOUNT_ID repository secret by
# scripts/bootstrap-cf.mjs, so no account identifier is committed to the repo.
# For local work, `wrangler dev --local` does not need it.
account_id = ""

workers_dev = true

[observability]
enabled = true

# Three schedules: hourly keeps the connected Google Sheet current without
# anyone having to remember to press "Sync now" (a cheap no-op until a sheet
# is actually connected); once a day (02:00 UTC ≈ 08:00 in Bangladesh) runs
# the Workers-AI-powered site health check; once a week, Monday 03:00 UTC ≈
# 09:00 Bangladesh Monday morning, runs the Workers-AI-powered developer
# report. index.ts's scheduled() tells the three apart by event.cron.
[triggers]
crons = ["0 * * * *", "0 2 * * *", "0 3 * * 1"]

# `database_id` is filled in by scripts/bootstrap-cf.mjs during deploy, which
# creates the database on first run and reuses it afterwards.
[[d1_databases]]
binding = "DB"
database_name = "arif-gadgets"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "arif-gadgets-media"

[[kv_namespaces]]
binding = "CACHE"
id = "00000000000000000000000000000000"

# Powers the admin assistant, support chat, daily health check, and weekly
# developer report (see src/lib/ai.ts). No key or account setup needed —
# authenticated by this same Cloudflare account, with its own free daily
# allocation. Only one AI binding is allowed per Worker.
[ai]
binding = "AI"

[vars]
STORE_NAME = "Arif Gadgets"
# Where the new-order alert email goes (see worker/src/lib/email.ts). Not a
# secret — just an inbox address — so it lives here rather than as a Worker
# secret. Empty disables the alert; the rest of checkout is unaffected.
ORDER_ALERT_EMAIL = "gadget02030@gmail.com"
# Sender for that alert email, on a domain verified in the Resend account
# (DKIM/SPF/MX records confirmed live). Falls back to Resend's shared sandbox
# address in email.ts if this is ever unset — see that file for why.
ALERT_EMAIL_FROM = "Arif Gadgets Alerts <alerts@arifgadget.store>"
# Browser origins allowed to call the API, comma separated.
#
# Left empty the API reflects whatever origin asks, which is the right default
# here: sessions are Bearer tokens rather than cookies, so CORS is not what
# protects the admin routes, and an incomplete list silently breaks checkout
# the moment the site moves to a new domain. Fill it in only if you want to
# stop other sites embedding the catalogue:
#   ALLOWED_ORIGINS = "https://arifgadget.store,https://www.arifgadget.store"
ALLOWED_ORIGINS = ""

# Secrets (set with `wrangler secret put`, or via the deploy workflow):
#   JWT_SECRET      — signing key for admin sessions
#   RESEND_API_KEY  — sends the new-order alert email; absent means no email is sent
